server {
    listen 80;
    server_name _;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass         http://backend-svc:3000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /health {
        proxy_pass       http://backend-svc:3000/health;
        proxy_set_header Host $host;
    }
}
